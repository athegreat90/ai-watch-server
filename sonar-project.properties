# SonarQube analysis (CI only; see docs/SONARQUBE.md). The token and host URL come from the environment.
sonar.projectKey=athegreat90_ai-watch-server
sonar.projectName=AI Watch Server

# Production code is cmd/ and internal/. Tests live beside it and are classified as tests.
sonar.sources=cmd,internal
sonar.tests=cmd,internal
sonar.exclusions=**/*_test.go
sonar.test.inclusions=**/*_test.go

# Coverage from: go test -race -covermode=atomic -coverprofile=coverage.out ./...
sonar.go.coverage.reportPaths=coverage.out
# The doc-comment checker contains no production statements.
sonar.coverage.exclusions=internal/doccheck/**

# bench/ (benchmarks and their historical results), bridge/ and tests/ (the Python reference
# server) are not production Go code and sit outside sonar.sources.

# Fail the analysis when the Quality Gate fails, so CI fails and releases are blocked.
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
