name: Daily base image remediation
on:
  schedule:
    - cron: '41 4 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency: daily-base-image
jobs:
  candidate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        id: app
        with:
          app-id: ${{ vars.SECURITY_APP_ID }}
          private-key: ${{ secrets.SECURITY_APP_PRIVATE_KEY }}
      - id: scan
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: bash security/remediate.sh
      - if: steps.scan.outputs.candidate == 'true'
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - if: steps.scan.outputs.candidate == 'true'
        run: go test ./... && python3 security/check_version.py
      - if: steps.scan.outputs.candidate == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          gh auth setup-git
          branch=security/go-base
          git config user.name 'AI Watch security bot'
          git config user.email 'ai-watch-security@users.noreply.github.com'
          git fetch origin "refs/heads/$branch:refs/remotes/origin/$branch" || true
          git switch -c "$branch"
          git add Dockerfile go.mod
          git commit -m 'Update Go container base'
          git push --force-with-lease origin "$branch"
          { printf 'Both image architectures passed smoke tests and vulnerability scans.\n\n'; git diff HEAD^ HEAD -- Dockerfile go.mod; } > /tmp/ai-watch-pr.md
          if gh pr view "$branch" --json state --jq .state | grep -q '^OPEN$'; then
            gh pr edit "$branch" --body-file /tmp/ai-watch-pr.md
          else
            gh pr create --head "$branch" --base main --title 'Update Go container base' --body-file /tmp/ai-watch-pr.md
          fi
