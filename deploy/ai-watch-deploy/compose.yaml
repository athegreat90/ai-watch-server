# AI Watch Server: standalone deployment. Needs only Docker with Compose; no source checkout.
# Choose the image in .env (AI_WATCH_SERVER_IMAGE): ":latest" tracks the newest stable release,
# ":vX.Y.Z" pins one immutable version. A running container never changes by itself: pull and
# recreate it (./install.sh --update) to move to a newer "latest".
name: ai-watch
services:
  ai-watch-server:
    image: ${AI_WATCH_SERVER_IMAGE:-ghcr.io/athegreat90/ai-watch-server:latest}
    cpus: 0.50
    init: true
    restart: unless-stopped
    ports:
      # Private by default. For the watch or hooks on other machines, set MONITOR_HOST_BIND to this host's LAN IP.
      - "${MONITOR_HOST_BIND:-127.0.0.1}:${MONITOR_HOST_PORT:-8765}:8765"
    environment:
      MONITOR_BIND: "0.0.0.0"
    # Must be able to read config.local.json (kept private, mode 0600): the installer sets these to your user.
    user: "${PUID:-1000}:${PGID:-1000}"
    volumes:
      - type: bind
        source: ./config.local.json
        target: /app/config.local.json
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 128m
